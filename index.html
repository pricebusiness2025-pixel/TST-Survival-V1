<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaac7b5, 60, 400);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(50, 60, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(50, 100, 20);
scene.add(light);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ----------------------------
   SAFE NOISE (NO LIBRARY)
---------------------------- */
function hash(x, z) {
  let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

function noise(x, z) {
  return hash(x, z) * 2 - 1;
}

/* ----------------------------
   TERRAIN HEIGHT
---------------------------- */
function getHeight(x, z) {
  return (
    noise(x * 0.05, z * 0.05) * 10 +
    noise(x * 0.01, z * 0.01) * 25
  );
}

/* ----------------------------
   TREES
---------------------------- */
function tree(x, y, z) {
  const g = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 3),
    new THREE.MeshStandardMaterial({ color: 0x6b4f2a })
  );
  trunk.position.y = 1.5;

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.5, 4, 6),
    new THREE.MeshStandardMaterial({ color: 0x2f7a3b })
  );
  leaves.position.y = 4;

  g.add(trunk, leaves);
  g.position.set(x, y, z);

  return g;
}

/* ----------------------------
   TERRAIN CHUNK
---------------------------- */
const SIZE = 100;

function chunk(cx, cz) {
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, 20, 20);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + cx * SIZE;
    const z = pos.getZ(i) + cz * SIZE;

    pos.setY(i, getHeight(x, z));
  }

  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ color: 0x4f7a3a })
  );

  mesh.position.set(cx * SIZE, 0, cz * SIZE);
  scene.add(mesh);

  // trees
  for (let i = 0; i < 12; i++) {
    const x = cx * SIZE + Math.random() * SIZE;
    const z = cz * SIZE + Math.random() * SIZE;
    const y = getHeight(x, z);

    if (Math.random() < 0.6) {
      scene.add(tree(x, y, z));
    }
  }
}

/* ----------------------------
   FARMS
---------------------------- */
function cabin(x, y, z) {
  const g = new THREE.Group();

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(6, 3, 6),
    new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
  );
  base.position.y = 1.5;

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(5, 3, 4),
    new THREE.MeshStandardMaterial({ color: 0x3a2a22 })
  );
  roof.position.y = 4;

  g.add(base, roof);
  g.position.set(x, y, z);

  return g;
}

/* ----------------------------
   WORLD BUILD
---------------------------- */
const farms = [];

function buildWorld() {

  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {

      const fx = x * 200;
      const fz = z * 200;

      const fy = getHeight(fx, fz);

      if (Math.random() < 0.3) {
        const f = cabin(fx, fy, fz);
        scene.add(f);
        farms.push(new THREE.Vector3(fx, fy, fz));
      }
    }
  }

  for (let x = -2; x <= 2; x++) {
    for (let z = -2; z <= 2; z++) {
      chunk(x, z);
    }
  }
}

/* ----------------------------
   CAMERA (STATIC TEST FIRST)
---------------------------- */
camera.position.set(60, 60, 60);
camera.lookAt(0, 0, 0);

buildWorld();

/* ----------------------------
   RENDER LOOP
---------------------------- */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();

</script>
