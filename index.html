<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Something, For Everyone - V3</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0e0e0e;
  font-family:monospace;
}

canvas {
  display:block;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:320px;
  background:rgba(0,0,0,0.75);
  padding:10px;
  border:1px solid #444;
  color:#ddd;
}

button { width:100%; margin:2px 0; }

.tab { display:none; }
.tab.active { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
<button onclick="goFullscreen()">Fullscreen</button>

<button onclick="setTab('news')">News</button>
<button onclick="setTab('inv')">Inventory</button>
<button onclick="setTab('craft')">Crafting</button>
<button onclick="setTab('log')">Log</button>

<div id="news" class="tab active">
<h3>Southern Table Times</h3>
<pre id="newsText"></pre>
</div>

<div id="inv" class="tab">
<h3>Inventory</h3>
<pre id="invText"></pre>
</div>

<div id="craft" class="tab">
<h3>Crafting</h3>
<button onclick="craftRifle()">Craft Pipe Rifle</button>
</div>

<div id="log" class="tab">
<h3>Log</h3>
<pre id="logText"></pre>
</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// FULLSCREEN FIX
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function goFullscreen(){
  document.documentElement.requestFullscreen();
}

// WORLD (same county, smoother feel now)
const map = [
"FFFFFFFFFF",
"FBFFRFWWFF",
"FFFFRFWWFF",
"RRRRRRRRRR",
"FTFFRFFBFF",
"FFFFFFFFFF"
];

const tiles = {
F:"#1f3d1f",
R:"#4a3b2a",
B:"#6b4b3a",
T:"#555",
W:"#0b2a3a"
};

// PLAYER (NOW SMOOTH FLOATING POSITION)
let player = {
x:1.5,
y:1.5,
dir:0,
boat:false
};

// INVENTORY
let inv = {
wood:1,
metal:2,
wire:1,
nails:2,
gunpowder:1,
pipeRifle:false,
ammo:3
};

let log = ["County V3 initialized"];

// INPUT STATE (SMOOTH CONTROLLER)
let input = {
forward:0,
turn:0,
shoot:false
};

// CAMERA / MOVEMENT SPEED
const speed = 0.05;
const turnSpeed = 0.04;

// DRAW WORLD
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

const size = 64;

for(let y=0;y<map.length;y++){
for(let x=0;x<map[y].length;x++){
ctx.fillStyle = tiles[map[y][x]];
ctx.fillRect(x*size,y*size,size,size);
}
}

// player
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(player.x*64, player.y*64, 10, 0, Math.PI*2);
ctx.fill();
}

// COLLISION
function isBlocked(x,y){
let tx = Math.floor(x);
let ty = Math.floor(y);
if(!map[ty] || !map[ty][tx]) return true;
return map[ty][tx] === "W";
}

// MOVE SYSTEM (SMOOTH)
function update(){
let dx = 0, dy = 0;

// forward movement
if(input.forward > 0){
dx += Math.cos(player.dir) * speed;
dy += Math.sin(player.dir) * speed;
}

// rotation
player.dir += input.turn * turnSpeed;

// apply movement
let nx = player.x + dx;
let ny = player.y + dy;

if(!isBlocked(nx, player.y)) player.x = nx;
if(!isBlocked(player.x, ny)) player.y = ny;
}

// SHOOT
function shoot(){
if(!inv.pipeRifle){ log.push("No rifle"); return; }
if(inv.ammo<=0){ log.push("Click... empty"); return; }

inv.ammo--;
log.push("Bang! Ammo: "+inv.ammo);
}

// CRAFT
function craftRifle(){
if(inv.pipeRifle){ log.push("Already have rifle"); return; }

if(inv.wood>=1 && inv.metal>=2 && inv.wire>=1){
inv.wood--; inv.metal-=2; inv.wire--;
inv.pipeRifle=true;
log.push("Pipe Rifle crafted");
}else{
log.push("Missing materials");
}
}

// UI
function setTab(t){
document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));
document.getElementById(t).classList.add("active");
}

function updateUI(){
document.getElementById("invText").textContent =
`Wood:${inv.wood}
Metal:${inv.metal}
Wire:${inv.wire}
Rifle:${inv.pipeRifle}
Ammo:${inv.ammo}`;

document.getElementById("logText").textContent =
log.slice(-10).join("\n");

document.getElementById("newsText").textContent =
"County stable. Farms reporting low activity.";
}

// 🎮 CONTROLLER (FIXED + ANALOG)
let gpIndex = null;

window.addEventListener("gamepadconnected",(e)=>{
gpIndex = e.gamepad.index;
log.push("Controller connected");
});

function gamepad(){
const gp = navigator.getGamepads()[gpIndex];

if(gp){
let lx = gp.axes[0];
let ly = gp.axes[1];

// movement (left stick forward/back)
input.forward = -ly;

// turn (left/right)
input.turn = lx * 0.8;

// shoot (A)
if(gp.buttons[0].pressed) shoot();
}

requestAnimationFrame(gamepad);
}

// KEYBOARD fallback
document.addEventListener("keydown",(e)=>{
if(e.key==="w") input.forward = 1;
if(e.key==="a") input.turn = -1;
if(e.key==="d") input.turn = 1;
if(e.key===" ") shoot();
});

document.addEventListener("keyup",()=>{
input.forward = 0;
input.turn = 0;
});

// LOOP
function loop(){
update();
draw();
updateUI();
requestAnimationFrame(loop);
}

loop();
gamepad();
</script>

</body>
</html>
