<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Something, For Everyone - V4</title>
<style>
html, body {
  margin:0;
  overflow:hidden;
  background:#0b0b0b;
  font-family:monospace;
}

canvas { display:block; }

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:360px;
  background:rgba(0,0,0,0.85);
  border:1px solid #444;
  padding:10px;
  color:#ddd;
  z-index:10;
}

button {
  width:100%;
  margin:2px 0;
  background:#222;
  color:#ddd;
  border:1px solid #444;
}

.tab { display:none; max-height:300px; overflow:auto; }
.tab.active { display:block; }

pre { white-space:pre-wrap; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">

<button onclick="goFullscreen()">Fullscreen</button>

<!-- 📰 NEWSPAPER TABS -->
<button onclick="setTab('news')">News</button>
<button onclick="setTab('inv')">Inventory</button>
<button onclick="setTab('craft')">Crafting</button>
<button onclick="setTab('log')">County Log</button>

<div id="news" class="tab active">
<h3>The Southern Table Times</h3>
<pre id="newsText"></pre>
</div>

<div id="inv" class="tab">
<h3>Inventory</h3>
<pre id="invText"></pre>
</div>

<div id="craft" class="tab">
<h3>Field Crafting</h3>
<button onclick="craftRifle()">Craft Pipe Rifle</button>
</div>

<div id="log" class="tab">
<h3>Survivor Log</h3>
<pre id="logText"></pre>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function goFullscreen(){
  document.documentElement.requestFullscreen();
}

/* =========================
   🌎 RAYCAST WORLD (DOOM STYLE)
========================= */

const map = [
"WWWWWWWWWW",
"WFFBFFRFFW",
"WFFBFFRFFW",
"WFFRRRRFFW",
"WFFFTTFFFW",
"WWWWWWWWWW"
];

const tex = {
"F":"#1f4d1f", // forest
"W":"#0a1f2a", // swamp fog
"B":"#5a3a2a", // barn
"R":"#4a3b2a", // road
"T":"#666"     // trailer
};

let player = {
x:2.5,
y:2.5,
dir:0
};

/* =========================
   🎮 INPUT
========================= */

let input = {
forward:0,
turn:0
};

const speed = 0.04;
const turnSpeed = 0.03;

/* =========================
   🧠 RAYCAST ENGINE
========================= */

function castRays(){
const fov = Math.PI/3;
const rays = canvas.width;

for(let i=0;i<rays;i++){

let rayAngle = player.dir - fov/2 + (i/rays)*fov;

let dist = 0;
let hit = false;
let tile = "W";

while(!hit && dist < 10){
  dist += 0.02;

  let rx = player.x + Math.cos(rayAngle)*dist;
  let ry = player.y + Math.sin(rayAngle)*dist;

  let tx = Math.floor(rx);
  let ty = Math.floor(ry);

  if(map[ty] && map[ty][tx] && map[ty][tx] !== " "){
    tile = map[ty][tx];
    hit = true;
  }
}

// fish-eye correction
dist = dist * Math.cos(rayAngle - player.dir);

let wallHeight = (canvas.height / dist);

let color = tex[tile] || "#000";

ctx.fillStyle = color;
ctx.fillRect(i, canvas.height/2 - wallHeight/2, 1, wallHeight);

}
}

/* =========================
   🚶 MOVEMENT
========================= */

function isWall(x,y){
let tx = Math.floor(x);
let ty = Math.floor(y);
return !map[ty] || map[ty][tx] === "W";
}

function update(){

player.dir += input.turn * turnSpeed;

let nx = player.x + Math.cos(player.dir) * input.forward * speed;
let ny = player.y + Math.sin(player.dir) * input.forward * speed;

if(!isWall(nx, player.y)) player.x = nx;
if(!isWall(player.x, ny)) player.y = ny;
}

/* =========================
   🔫 WEAPON
========================= */

let inv = {
pipeRifle:false,
ammo:3,
wood:1,
metal:2,
wire:1
};

let log = ["Entered County V4..."];

function shoot(){
if(!inv.pipeRifle){ log.push("No weapon"); return; }
if(inv.ammo<=0){ log.push("Click... empty"); return; }

inv.ammo--;
log.push("Bang! Ammo "+inv.ammo);
}

/* =========================
   🔧 CRAFTING
========================= */

function craftRifle(){
if(inv.pipeRifle){ log.push("Already crafted"); return; }

if(inv.wood>=1 && inv.metal>=2 && inv.wire>=1){
inv.wood--; inv.metal-=2; inv.wire--;
inv.pipeRifle = true;
log.push("Pipe Rifle crafted");
}else{
log.push("Missing materials");
}
}

/* =========================
   📰 INTERACTIVE NEWSPAPER
========================= */

function getNews(){
let t =
`THE SOUTHERN TABLE TIMES

FRONT PAGE:
- County remains quiet
- Farm activity minimal

LOCAL REPORTS:
- Swamp fog increasing
- Barns reported abandoned

CRAFTING NOTES:
- Pipe rifle schematic confirmed
- Scrap metal usable in field builds

RUMORS:
- Duck boat seen near river bend
`;
return t;
}

/* =========================
   🧭 UI SYSTEM (REAL PAPER FEEL)
========================= */

function setTab(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function updateUI(){
document.getElementById("newsText").textContent = getNews();

document.getElementById("invText").textContent =
`PIPE RIFLE: ${inv.pipeRifle}
AMMO: ${inv.ammo}
WOOD: ${inv.wood}
METAL: ${inv.metal}
WIRE: ${inv.wire}`;

document.getElementById("logText").textContent =
log.slice(-12).join("\n");
}

/* =========================
   🎮 CONTROLLER FIXED
========================= */

let gpIndex = null;

window.addEventListener("gamepadconnected",(e)=>{
gpIndex = e.gamepad.index;
log.push("Controller connected");
});

function gamepad(){
const gp = navigator.getGamepads()[gpIndex];
if(gp){

let lx = gp.axes[0];
let ly = gp.axes[1];

input.turn = lx;
input.forward = -ly;

if(gp.buttons[0].pressed) shoot();

}

requestAnimationFrame(gamepad);
}

/* =========================
   ⌨️ KEYBOARD
========================= */

document.addEventListener("keydown",(e)=>{
if(e.key==="w") input.forward = 1;
if(e.key==="s") input.forward = -1;
if(e.key==="a") input.turn = -1;
if(e.key==="d") input.turn = 1;
if(e.key===" ") shoot();
});

document.addEventListener("keyup",()=>{
input.forward = 0;
input.turn = 0;
input.turn = 0;
});

/* =========================
   LOOP
========================= */

function loop(){
update();
ctx.fillStyle="#000";
ctx.fillRect(0,0,canvas.width,canvas.height);

castRays();

updateUI();

requestAnimationFrame(loop);
}

loop();
gamepad();

</script>

</body>
</html>
