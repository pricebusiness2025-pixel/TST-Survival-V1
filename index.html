<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Something, For Everyone - County V2</title>
<style>
body { margin:0; background:#111; color:#ddd; font-family:monospace; overflow:hidden; }
canvas { display:block; background:#1b1b1b; }

#ui {
  position:absolute; top:10px; left:10px;
  width:340px;
  background:rgba(0,0,0,0.75);
  padding:10px;
  border:1px solid #444;
}

button { width:100%; margin:2px 0; }
pre { white-space:pre-wrap; }

.tab { display:none; }
.tab.active { display:block; }
</style>
</head>
<body>

<canvas id="game" width="640" height="640"></canvas>

<div id="ui">
  <button onclick="setTab('news')">News</button>
  <button onclick="setTab('inv')">Inventory</button>
  <button onclick="setTab('craft')">Crafting</button>
  <button onclick="setTab('log')">Log</button>

  <div id="news" class="tab active">
    <h3>Southern Table Times</h3>
    <pre id="newsText"></pre>
  </div>

  <div id="inv" class="tab">
    <h3>Inventory</h3>
    <pre id="invText"></pre>
  </div>

  <div id="craft" class="tab">
    <h3>Crafting</h3>
    <button onclick="craftRifle()">Craft Pipe Rifle (3 Shot)</button>
  </div>

  <div id="log" class="tab">
    <h3>Log</h3>
    <pre id="logText"></pre>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// TILE WORLD
const map = [
"FFFFFFFFFF",
"FBFFRFWWFF",
"FFFFRFWWFF",
"RRRRRRRRRR",
"FTFFRFFBFF",
"FFFFFFFFFF"
];

const tiles = {
"F":"#1f3d1f",
"R":"#4a3b2a",
"B":"#6b4b3a",
"T":"#555",
"W":"#0b2a3a"
};

// PLAYER
let player = {
x:1,y:1,
dir:0,
boat:false
};

// INVENTORY
let inv = {
wood:1,
metal:2,
wire:1,
nails:2,
gunpowder:1,
pipeRifle:false,
ammo:3
};

let log = ["Entered County V2..."];

// 🌎 POI SYSTEM (OPEN WORLD FEEL)
const POIs = {
"2,1": "ABANDONED FARM",
"7,1": "SWAMP EDGE",
"4,3": "HIGHWAY",
"1,4": "TRAILER FARM"
};

// 📰 NEWSPAPER WORLD STATE
function getNews() {
let t =
`THE SOUTHERN TABLE TIMES

LOCAL REPORTS:
`;

if(player.y >= 3) t += "- Wildlife sightings increased near farms\n";
if(player.x >= 5) t += "- Swamp routes partially flooded\n";
t += "\nFARM REPORTS:\n";

t += "- Miller Farm: Abandoned\n";
t += "- Ridge Farm: Loot depleted\n";

return t;
}

// DRAW WORLD
function draw() {
ctx.clearRect(0,0,640,640);

for(let y=0;y<map.length;y++){
for(let x=0;x<map[y].length;x++){
ctx.fillStyle = tiles[map[y][x]];
ctx.fillRect(x*64,y*64,64,64);
}
}

// POIs
for(let key in POIs){
let [x,y]=key.split(",").map(Number);
ctx.fillStyle="orange";
ctx.fillRect(x*64+20,y*64+20,24,24);
}

// PLAYER
ctx.fillStyle="yellow";
ctx.fillRect(player.x*64+20,player.y*64+20,24,24);
}

// MOVE SYSTEM
function moveForward(){
let dx=0,dy=0;
if(player.dir===0)dy=-1;
if(player.dir===1)dx=1;
if(player.dir===2)dy=1;
if(player.dir===3)dx=-1;

let nx=player.x+dx;
let ny=player.y+dy;

if(map[ny] && map[ny][nx] !== "W"){
player.x=nx;
player.y=ny;
log.push("Moved to "+nx+","+ny);

// POI interaction
let poi = POIs[`${nx},${ny}`];
if(poi){
log.push("Discovered: "+poi);
}
}
}

function turnLeft(){ player.dir=(player.dir+3)%4; }
function turnRight(){ player.dir=(player.dir+1)%4; }

// 🔫 PIPE RIFLE
function shoot(){
if(!inv.pipeRifle){ log.push("No rifle"); return; }
if(inv.ammo<=0){ log.push("Click... empty"); return; }
inv.ammo--;
log.push("Bang! Ammo "+inv.ammo);
}

// 🔧 CRAFTING
function craftRifle(){
if(inv.pipeRifle){ log.push("Already crafted"); return; }

if(inv.wood>=1 && inv.metal>=2 && inv.wire>=1){
inv.wood--; inv.metal-=2; inv.wire--;
inv.pipeRifle=true;
log.push("Pipe Rifle crafted (3 shot)");
} else log.push("Missing materials");
}

// 🧭 UI
function setTab(t){
document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));
document.getElementById(t).classList.add("active");
}

// CONTROLLER
function gamepad(){
let gp=navigator.getGamepads()[0];
if(gp){
if(gp.buttons[12].pressed) moveForward();
if(gp.buttons[14].pressed) turnLeft();
if(gp.buttons[15].pressed) turnRight();
if(gp.buttons[0].pressed) shoot();
}
requestAnimationFrame(gamepad);
}

// KEYBOARD
document.addEventListener("keydown",(e)=>{
if(e.key==="w")moveForward();
if(e.key==="a")turnLeft();
if(e.key==="d")turnRight();
if(e.key===" ")shoot();
});

// UI UPDATE
function updateUI(){
document.getElementById("invText").textContent =
`Wood: ${inv.wood}
Metal: ${inv.metal}
Wire: ${inv.wire}
Nails: ${inv.nails}

Pipe Rifle: ${inv.pipeRifle}
Ammo: ${inv.ammo}`;

document.getElementById("logText").textContent =
log.slice(-12).join("\n");

document.getElementById("newsText").textContent =
getNews();
}

// LOOP
function loop(){
draw();
updateUI();
requestAnimationFrame(loop);
}

loop();
gamepad();
</script>

</body>
  </html>
